<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wie möchtest du spielen?</title>
<style>
  :root {
    /* Ocean palette — picked from the game art, not defaults */
    --sun:      #ffce3a;   /* treasure yellow (title + stars) */
    --sun-deep: #ffb028;
    --aqua:     #37c3e8;   /* sunlit surface water */
    --sea:      #0e6ea6;   /* mid ocean */
    --deep:     #0a3f66;   /* deep sea */
    --abyss:    #06263f;   /* darkest */
    --coral:    #ff8a5c;   /* card A accent (warm) */
    --kelp:     #1fbf7a;   /* card B accent (green) */
    --foam:     #f3fbff;   /* near-white, blue-biased */
    --ink:      #06304d;   /* deep navy text */
    --ink-soft: #3f6a86;
    --card-bg:  rgba(255,255,255,0.94);
    --card-line: rgba(6,48,77,0.10);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --aqua: #1c93bd; --sea: #0a5480; --deep: #062f4d; --abyss: #03151f;
      --foam: #eaf6fd; --ink: #08324f; --card-bg: rgba(233,246,253,0.95);
    }
  }
  :root[data-theme="light"] {
    --aqua:#37c3e8; --sea:#0e6ea6; --deep:#0a3f66; --abyss:#06263f;
    --foam:#f3fbff; --ink:#06304d; --card-bg:rgba(255,255,255,0.94);
  }
  :root[data-theme="dark"] {
    --aqua:#1c93bd; --sea:#0a5480; --deep:#062f4d; --abyss:#03151f;
    --foam:#eaf6fd; --ink:#08324f; --card-bg:rgba(233,246,253,0.95);
  }

  * { box-sizing: border-box; }

  .stage {
    min-height: 100%;
    font-family: 'Baloo 2','Fredoka','Chalkboard SE','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
    color: var(--foam);
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.55), rgba(255,255,255,0) 45%),
      linear-gradient(180deg, var(--aqua) 0%, var(--sea) 42%, var(--deep) 74%, var(--abyss) 100%);
    padding: clamp(20px, 4vw, 56px) clamp(16px, 4vw, 48px) clamp(48px, 6vw, 88px);
    position: relative;
    overflow: hidden;
  }

  /* Sun rays fanning from the surface */
  .rays { position: absolute; inset: 0; pointer-events: none; overflow: hidden; opacity: .5; }
  .rays span {
    position: absolute; top: -12%; left: 50%; width: clamp(60px,9vw,130px); height: 150%;
    background: linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 70%);
    transform-origin: top center; filter: blur(2px);
  }
  .rays span:nth-child(1){ transform: translateX(-50%) rotate(-22deg); }
  .rays span:nth-child(2){ transform: translateX(-50%) rotate(-8deg);  opacity:.8; }
  .rays span:nth-child(3){ transform: translateX(-50%) rotate(7deg);   }
  .rays span:nth-child(4){ transform: translateX(-50%) rotate(20deg);  opacity:.7; }

  /* Rising bubbles */
  .bubbles { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .bubbles i {
    position:absolute; bottom:-40px; border-radius:50%;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,.15) 60%, rgba(255,255,255,0));
    animation: rise linear infinite;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0) scale(.6); opacity:0; }
    12%  { opacity:.8; }
    100% { transform: translateY(-108vh) translateX(var(--drift,14px)) scale(1); opacity:0; }
  }

  .wrap { position: relative; max-width: 1120px; margin: 0 auto; }

  header { text-align: center; margin-bottom: clamp(22px, 3.5vw, 40px); }
  .eyebrow {
    display:inline-block; font-size: clamp(.8rem,2.4vw,1rem); letter-spacing: .14em;
    text-transform: uppercase; font-weight: 700; color: var(--sun);
    background: rgba(6,38,63,.35); padding: .35em 1em; border-radius: 999px;
    box-shadow: inset 0 0 0 2px rgba(255,206,58,.35);
  }
  h1 {
    margin: .4em 0 .15em; text-wrap: balance;
    font-size: clamp(2.1rem, 7vw, 4.2rem); line-height: .98; font-weight: 800;
    color: var(--sun);
    letter-spacing: .5px;
    text-shadow:
      -2px -2px 0 #06304d, 2px -2px 0 #06304d, -2px 2px 0 #06304d, 2px 2px 0 #06304d,
      0 4px 0 var(--sun-deep), 0 7px 10px rgba(3,21,31,.45);
  }
  .sub { font-size: clamp(1rem,3vw,1.4rem); font-weight:600; color: var(--foam); opacity:.95; }

  .cards {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: clamp(16px, 3vw, 30px);
  }
  @media (max-width: 760px) { .cards { grid-template-columns: 1fr; } }

  .card {
    position: relative; text-align: left;
    background: var(--card-bg); color: var(--ink);
    border: none; border-radius: 26px; padding: 0; cursor: pointer;
    box-shadow: 0 12px 0 rgba(3,21,31,.22), 0 20px 40px rgba(3,21,31,.35);
    transition: transform .18s ease, box-shadow .18s ease;
    overflow: hidden; font-family: inherit;
    outline-offset: 4px;
    --accent: var(--coral);
  }
  .card.b { --accent: var(--kelp); }
  .card::before {
    content:""; position:absolute; inset:0 0 auto 0; height: 8px; background: var(--accent);
  }
  .card:hover, .card:focus-visible { transform: translateY(-8px) rotate(-.5deg); box-shadow: 0 18px 0 rgba(3,21,31,.22), 0 26px 50px rgba(3,21,31,.45); }
  .card.b:hover, .card.b:focus-visible { transform: translateY(-8px) rotate(.5deg); }
  .card:focus-visible { outline: 4px solid var(--sun); }

  .shot { display:block; width:100%; aspect-ratio: 16/9; object-fit: cover; background:#0a3f66; }

  .label {
    display:flex; align-items:center; gap:.55em;
    padding: clamp(14px,2.4vw,20px) clamp(16px,2.6vw,24px) 0;
  }
  .pill {
    flex: none; width: 2.1em; height: 2.1em; display:grid; place-items:center;
    background: var(--accent); color:#fff; font-weight:800; border-radius: 50%;
    font-size: clamp(1rem,2.6vw,1.3rem); box-shadow: 0 3px 0 rgba(3,21,31,.2);
  }
  .label h2 { margin:0; font-size: clamp(1.25rem,3.4vw,1.7rem); font-weight:800; line-height:1.05; }
  .desc {
    margin: .5em 0 0; padding: 0 clamp(16px,2.6vw,24px);
    color: var(--ink-soft); font-size: clamp(.95rem,2.5vw,1.08rem); font-weight:600; line-height:1.35;
  }
  .how {
    margin: .7em clamp(16px,2.6vw,24px) 0; padding: .7em .9em;
    background: rgba(6,48,77,.06); border-radius: 14px;
    font-size: clamp(.85rem,2.3vw,1rem); font-weight:600; color: var(--ink);
  }
  .how b { color: var(--accent); }

  .choose {
    margin: clamp(14px,2.4vw,20px) clamp(16px,2.6vw,24px) clamp(18px,2.6vw,24px);
    display:flex; align-items:center; justify-content:center; gap:.5em;
    background: var(--accent); color:#fff; font-family:inherit; font-weight:800;
    font-size: clamp(1.05rem,2.8vw,1.28rem); border:none; border-radius: 16px;
    padding: .7em 1em; cursor:pointer; box-shadow: 0 5px 0 rgba(3,21,31,.25);
    transition: transform .1s ease, box-shadow .1s ease; width: calc(100% - 2*clamp(16px,2.6vw,24px));
  }
  .choose:active { transform: translateY(4px); box-shadow: 0 1px 0 rgba(3,21,31,.25); }

  /* Chosen state */
  .card.chosen { transform: translateY(-6px) scale(1.015); }
  .card.chosen::after {
    content:"✓ Gewählt!"; position:absolute; top:14px; right:14px;
    background: var(--sun); color:#06304d; font-weight:800; font-size: .95rem;
    padding:.35em .8em; border-radius:999px; box-shadow:0 4px 0 var(--sun-deep);
    animation: pop .3s ease;
  }
  .card.dimmed { opacity:.55; filter: saturate(.7); }
  @keyframes pop { from { transform: scale(.4); } to { transform: scale(1); } }

  .banner {
    max-width: 1120px; margin: clamp(20px,3vw,32px) auto 0; text-align:center;
    min-height: 2.2em;
  }
  .banner .msg {
    display:inline-block; background: var(--sun); color:#06304d;
    font-weight:800; font-size: clamp(1.05rem,3vw,1.4rem);
    padding:.55em 1.1em; border-radius: 18px; box-shadow: 0 6px 0 var(--sun-deep);
    animation: pop .35s ease;
  }
  .hint { text-align:center; margin-top: 1.6em; font-size:.95rem; font-weight:600; color: var(--foam); opacity:.8; }

  @media (prefers-reduced-motion: reduce) {
    .bubbles i { animation: none; display:none; }
    .card, .choose { transition: none; }
    .card.chosen::after, .banner .msg { animation: none; }
  }
</style>
</head>

        <p class="desc">Reise von links nach rechts durchs Meer, hüpf über Felsen und sammel das Öl ein!</p>
        <div class="how">🕹️ <b>So geht's:</b> Pfeil links/rechts zum Laufen, gelber Knopf zum Hüpfen.</div>
        <span class="choose">Das will ich! 💛</span>
      </button>
    </div>

    <div class="banner" id="banner" role="status" aria-live="polite"></div>
    <p class="hint">Kein Falsch dabei — such einfach aus, was am meisten Spaß macht. 🐠 Du kannst es dir später anders überlegen!</p>

</div>

<script>
  // Gentle rising bubbles
  (function () {
    var box = document.getElementById('bubbles');
    if (!box || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    var N = 26;
    for (var i = 0; i < N; i++) {
      var b = document.createElement('i');
      var size = 6 + (i * 37 % 22);
      b.style.width = size + 'px';
      b.style.height = size + 'px';
      b.style.left = (i * 53 % 100) + '%';
      b.style.setProperty('--drift', ((i % 5) - 2) * 16 + 'px');
      b.style.animationDuration = (7 + (i * 29 % 9)) + 's';
      b.style.animationDelay = (-(i * 41 % 12)) + 's';
      box.appendChild(b);
    }
  })();

  // Choosing
  var cards = Array.prototype.slice.call(document.querySelectorAll('.card'));
  var banner = document.getElementById('banner');
  var msgs = {
    'Frei schwimmen': 'Super Wahl! 🎉 Du schwimmst frei durchs Meer und rettest das Wasser!',
    'Seitwärts laufen': 'Super Wahl! 🎉 Auf geht’s — von links nach rechts durch die Welt!'
  };
  cards.forEach(function (card) {
    card.addEventListener('click', function () {
      cards.forEach(function (c) { c.classList.remove('chosen'); c.classList.add('dimmed'); });
      card.classList.add('chosen'); card.classList.remove('dimmed');
      var name = card.getAttribute('data-name');
      banner.innerHTML = '<span class="msg">' + (msgs[name] || 'Super Wahl! 🎉') + '</span>';
    });
  });
</script>
