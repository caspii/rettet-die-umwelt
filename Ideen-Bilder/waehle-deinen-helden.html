<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Wähle deinen Helden!</title>
<style>
  :root {
    --sun:#ffce3a; --sun-deep:#ffb028;
    --aqua:#37c3e8; --sea:#0e6ea6; --deep:#0a3f66; --abyss:#06263f;
    --coral:#ff8a5c; --kelp:#1fbf7a; --grape:#8a6bd6; --sky:#3aa6e6;
    --foam:#f3fbff; --ink:#06304d; --ink-soft:#3f6a86;
    --card-bg:rgba(255,255,255,0.94);
  }
  @media (prefers-color-scheme: dark) {
    :root { --aqua:#1c93bd; --sea:#0a5480; --deep:#062f4d; --abyss:#03151f;
      --foam:#eaf6fd; --ink:#08324f; --card-bg:rgba(233,246,253,0.95); }
  }
  :root[data-theme="light"] { --aqua:#37c3e8; --sea:#0e6ea6; --deep:#0a3f66; --abyss:#06263f;
    --foam:#f3fbff; --ink:#06304d; --card-bg:rgba(255,255,255,0.94); }
  :root[data-theme="dark"] { --aqua:#1c93bd; --sea:#0a5480; --deep:#062f4d; --abyss:#03151f;
    --foam:#eaf6fd; --ink:#08324f; --card-bg:rgba(233,246,253,0.95); }

  * { box-sizing:border-box; }

  .stage {
    min-height:100%;
    font-family:'Baloo 2','Fredoka','Chalkboard SE','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
    color:var(--foam);
    background:
      radial-gradient(120% 80% at 50% -10%, rgba(255,255,255,0.55), rgba(255,255,255,0) 45%),
      linear-gradient(180deg, var(--aqua) 0%, var(--sea) 42%, var(--deep) 74%, var(--abyss) 100%);
    padding: clamp(20px,4vw,56px) clamp(16px,4vw,48px) clamp(48px,6vw,88px);
    position:relative; overflow:hidden;
  }
  .rays { position:absolute; inset:0; pointer-events:none; overflow:hidden; opacity:.5; }
  .rays span { position:absolute; top:-12%; left:50%; width:clamp(60px,9vw,130px); height:150%;
    background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,0) 70%);
    transform-origin:top center; filter:blur(2px); }
  .rays span:nth-child(1){ transform:translateX(-50%) rotate(-22deg); }
  .rays span:nth-child(2){ transform:translateX(-50%) rotate(-8deg); opacity:.8; }
  .rays span:nth-child(3){ transform:translateX(-50%) rotate(7deg); }
  .rays span:nth-child(4){ transform:translateX(-50%) rotate(20deg); opacity:.7; }
  .bubbles { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
  .bubbles i { position:absolute; bottom:-40px; border-radius:50%;
    background:radial-gradient(circle at 30% 30%, rgba(255,255,255,.9), rgba(255,255,255,.15) 60%, rgba(255,255,255,0));
    animation:rise linear infinite; }
  @keyframes rise { 0%{transform:translateY(0) translateX(0) scale(.6);opacity:0;} 12%{opacity:.8;}
    100%{transform:translateY(-108vh) translateX(var(--drift,14px)) scale(1);opacity:0;} }

  .wrap { position:relative; max-width:1120px; margin:0 auto; }
  header { text-align:center; margin-bottom:clamp(20px,3vw,36px); }
  .eyebrow { display:inline-block; font-size:clamp(.8rem,2.4vw,1rem); letter-spacing:.14em;
    text-transform:uppercase; font-weight:700; color:var(--sun);
    background:rgba(6,38,63,.35); padding:.35em 1em; border-radius:999px;
    box-shadow:inset 0 0 0 2px rgba(255,206,58,.35); }
  h1 { margin:.4em 0 .15em; text-wrap:balance; font-size:clamp(2rem,7vw,4rem); line-height:.98; font-weight:800;
    color:var(--sun); letter-spacing:.5px;
    text-shadow:-2px -2px 0 #06304d,2px -2px 0 #06304d,-2px 2px 0 #06304d,2px 2px 0 #06304d,
      0 4px 0 var(--sun-deep),0 7px 10px rgba(3,21,31,.45); }
  .sub { font-size:clamp(1rem,3vw,1.35rem); font-weight:600; opacity:.95; }

  .heroes { display:grid; grid-template-columns:repeat(auto-fit, minmax(230px,1fr)); gap:clamp(14px,2.4vw,24px); }

  .hero {
    position:relative; text-align:center; background:var(--card-bg); color:var(--ink);
    border:none; border-radius:24px; padding:0 0 clamp(14px,2vw,18px); cursor:pointer; overflow:hidden;
    font-family:inherit; box-shadow:0 10px 0 rgba(3,21,31,.20),0 18px 34px rgba(3,21,31,.32);
    transition:transform .16s ease, box-shadow .16s ease; outline-offset:4px; --accent:var(--coral);
  }
  .hero.h2{ --accent:var(--grape); } .hero.h3{ --accent:var(--sky); } .hero.h4{ --accent:var(--kelp); }
  .hero::before{ content:""; position:absolute; inset:0 0 auto 0; height:8px; background:var(--accent); z-index:2; }
  .hero:hover, .hero:focus-visible { transform:translateY(-8px) rotate(-.4deg);
    box-shadow:0 16px 0 rgba(3,21,31,.20),0 24px 44px rgba(3,21,31,.42); }
  .hero:focus-visible { outline:4px solid var(--sun); }
  .hero .pic { display:block; width:100%; aspect-ratio:4/3; object-fit:cover; object-position:center 42%; background:#bfe9f7; }
  .hero .cap { padding:clamp(10px,1.8vw,14px) 14px 0; }
  .hero .cap h2 { margin:0; font-size:clamp(1.15rem,2.8vw,1.45rem); font-weight:800; }
  .hero .cap p { margin:.25em 0 0; font-size:clamp(.85rem,2.2vw,1rem); font-weight:600; color:var(--ink-soft); line-height:1.3; }
  .hero .tag { display:inline-block; margin-top:.7em; background:var(--accent); color:#fff; font-weight:800;
    font-size:clamp(.9rem,2.3vw,1.05rem); padding:.4em 1.1em; border-radius:14px; box-shadow:0 4px 0 rgba(3,21,31,.22); }
  .hero.chosen { transform:translateY(-6px) scale(1.02); }
  .hero.chosen::after { content:"✓"; position:absolute; top:12px; right:12px; width:1.9em; height:1.9em;
    display:grid; place-items:center; background:var(--sun); color:#06304d; font-weight:900; border-radius:50%;
    box-shadow:0 4px 0 var(--sun-deep); animation:pop .3s ease; z-index:3; }
  .hero.dimmed { opacity:.5; filter:saturate(.65); }
  @keyframes pop { from{transform:scale(.4);} to{transform:scale(1);} }

  /* Name step */
  .namestep {
    max-width:640px; margin:clamp(22px,3.5vw,38px) auto 0; background:var(--card-bg); color:var(--ink);
    border-radius:24px; padding:clamp(18px,3vw,28px); text-align:center;
    box-shadow:0 12px 0 rgba(3,21,31,.20),0 20px 40px rgba(3,21,31,.34);
    display:none;
  }
  .namestep.show { display:block; animation:pop .3s ease; }
  .namestep .mini { width:96px; height:96px; border-radius:50%; object-fit:cover; object-position:center 42%;
    border:5px solid var(--sun); box-shadow:0 5px 0 var(--sun-deep); background:#bfe9f7; }
  .namestep h3 { margin:.5em 0 0; font-size:clamp(1.2rem,3.4vw,1.7rem); font-weight:800; }
  .nameform { display:flex; flex-wrap:wrap; gap:12px; justify-content:center; margin-top:1em; }
  .nameform input {
    flex:1 1 220px; min-width:0; font-family:inherit; font-size:clamp(1.05rem,3vw,1.3rem); font-weight:700;
    color:var(--ink); text-align:center; padding:.6em .8em; border-radius:16px;
    border:3px solid rgba(6,48,77,.18); background:#fff; outline-offset:3px;
  }
  .nameform input:focus-visible { outline:4px solid var(--sun); border-color:var(--sun); }
  .nameform button {
    flex:0 0 auto; font-family:inherit; font-weight:800; font-size:clamp(1.05rem,3vw,1.25rem); color:#fff;
    background:var(--kelp); border:none; border-radius:16px; padding:.6em 1.3em; cursor:pointer;
    box-shadow:0 5px 0 rgba(3,21,31,.25); transition:transform .1s ease,box-shadow .1s ease;
  }
  .nameform button:active { transform:translateY(4px); box-shadow:0 1px 0 rgba(3,21,31,.25); }
  .result { margin-top:1em; min-height:1.4em; }
  .result .msg { display:inline-block; background:var(--sun); color:#06304d; font-weight:800;
    font-size:clamp(1.1rem,3vw,1.5rem); padding:.5em 1.1em; border-radius:18px; box-shadow:0 6px 0 var(--sun-deep);
    animation:pop .35s ease; }

  .hint { text-align:center; margin-top:1.6em; font-size:.95rem; font-weight:600; opacity:.8; }

  @media (prefers-reduced-motion: reduce) {
    .bubbles i { animation:none; display:none; }
    .hero, .nameform button { transition:none; }
    .hero.chosen::after, .namestep.show, .result .msg { animation:none; }
  }
</style>
</head>

    <div class="namestep" id="namestep">
      <img class="mini" id="mini" src="" alt="" />
      <h3 id="namePrompt">Wie soll dein Held heißen?</h3>

        <input id="nameInput" type="text" maxlength="20" autocomplete="off"
               placeholder="z. B. Finn, Lina, Flipper …" aria-label="Name deines Helden" />
        <button type="submit">Fertig! ✨</button>
      </form>
      <div class="result" id="result" role="status" aria-live="polite"></div>
    </div>

</div>

<script>
  (function () {
    var box = document.getElementById('bubbles');
    if (!box || window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    for (var i = 0; i < 26; i++) {
      var b = document.createElement('i');
      var size = 6 + (i * 37 % 22);
      b.style.width = size + 'px'; b.style.height = size + 'px';
      b.style.left = (i * 53 % 100) + '%';
      b.style.setProperty('--drift', ((i % 5) - 2) * 16 + 'px');
      b.style.animationDuration = (7 + (i * 29 % 9)) + 's';
      b.style.animationDelay = (-(i * 41 % 12)) + 's';
      box.appendChild(b);
    }
  })();

  var heroes = Array.prototype.slice.call(document.querySelectorAll('.hero'));
  var step = document.getElementById('namestep');
  var mini = document.getElementById('mini');
  var promptEl = document.getElementById('namePrompt');
  var form = document.getElementById('nameform');
  var input = document.getElementById('nameInput');
  var result = document.getElementById('result');
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var current = null;

  heroes.forEach(function (h) {
    h.addEventListener('click', function () {
      heroes.forEach(function (o) { o.classList.remove('chosen'); o.classList.add('dimmed'); });
      h.classList.add('chosen'); h.classList.remove('dimmed');
      current = h.getAttribute('data-name');
      mini.src = h.getAttribute('data-img');
      mini.alt = current;
      promptEl.textContent = h.getAttribute('data-prompt');
      result.innerHTML = '';
      input.value = '';
      step.classList.add('show');
      step.scrollIntoView({ behavior: reduce ? 'auto' : 'smooth', block: 'center' });
      setTimeout(function () { input.focus(); }, reduce ? 0 : 320);
    });
  });

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    var name = input.value.trim();
    if (!name) {
      result.innerHTML = '<span class="msg">Gib deinem Helden noch einen Namen! ✏️</span>';
      input.focus();
      return;
    }
    result.innerHTML = '<span class="msg">🎉 Toll! ' + name.replace(/[<>&]/g, '') + ' rettet das Meer!</span>';
  });
</script>
