<head>

<title>Wie gewinnt man? – Rettet die Umwelt</title>
<style>
  :root{
    --sun:#ffce3a; --sun-deep:#ffb028; --aqua:#37c3e8; --sea:#0e6ea6; --deep:#0a3f66; --abyss:#06263f;
    --coral:#ff8a5c; --kelp:#1fbf7a; --grape:#8a6bd6; --foam:#f3fbff; --ink:#06304d; --ink-soft:#3f6a86; --card:#fff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;}
  body{
    font-family:'Baloo 2','Fredoka','Chalkboard SE','Comic Sans MS','Trebuchet MS',system-ui,sans-serif;
    color:var(--foam);
    background:
      radial-gradient(120% 70% at 50% -8%, rgba(255,255,255,.5), rgba(255,255,255,0) 45%),
      linear-gradient(180deg,var(--aqua),var(--sea) 42%,var(--deep) 74%,var(--abyss));
    padding:clamp(20px,4vw,52px) clamp(14px,4vw,40px) 70px; text-align:center;
  }
  a.back{position:fixed;top:12px;left:14px;color:#06304d;background:var(--sun);text-decoration:none;
    font-weight:800;padding:.4em .9em;border-radius:999px;box-shadow:0 3px 0 var(--sun-deep);font-size:.9rem;z-index:5;}
  .wrap{max-width:1040px;margin:0 auto;}
  .eyebrow{display:inline-block;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
    color:var(--sun);background:rgba(6,38,63,.35);padding:.35em 1em;border-radius:999px;box-shadow:inset 0 0 0 2px rgba(255,206,58,.35);}
  h1{margin:.4em 0 .1em;font-size:clamp(2rem,6vw,3.4rem);line-height:1;color:var(--sun);text-wrap:balance;
    text-shadow:-2px -2px 0 #06304d,2px -2px 0 #06304d,-2px 2px 0 #06304d,2px 2px 0 #06304d,0 4px 0 var(--sun-deep),0 7px 10px rgba(3,21,31,.4);}
  .sub{font-weight:600;opacity:.95;font-size:clamp(1rem,3vw,1.3rem);max-width:660px;margin:.4em auto 1.4em;}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,2.4vw,24px);}
  @media(max-width:820px){.cards{grid-template-columns:1fr;max-width:460px;margin:0 auto;}}
  .card{position:relative;text-align:left;background:var(--card);color:var(--ink);border:none;border-radius:22px;padding:0;
    cursor:pointer;overflow:hidden;font-family:inherit;box-shadow:0 10px 0 rgba(3,21,31,.2),0 18px 34px rgba(3,21,31,.34);
    transition:transform .16s ease,box-shadow .16s ease;outline-offset:4px;--accent:var(--kelp);}
  .card.b{--accent:var(--coral);} .card.c{--accent:var(--sun);}
  .card::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--accent);z-index:2;}
  .card:hover,.card:focus-visible{transform:translateY(-8px) rotate(-.4deg);box-shadow:0 16px 0 rgba(3,21,31,.2),0 24px 46px rgba(3,21,31,.44);}
  .card:focus-visible{outline:4px solid var(--sun);}
  .shot{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#bfe9f7;}
  .cap{padding:clamp(12px,2vw,16px) clamp(14px,2.2vw,20px);}
  .cap .pill{display:inline-flex;align-items:center;justify-content:center;width:1.8em;height:1.8em;border-radius:50%;
    background:var(--accent);color:#fff;font-weight:800;box-shadow:0 3px 0 rgba(3,21,31,.2);margin-bottom:.35em;}
  .cap h2{margin:.1em 0 .15em;font-size:clamp(1.15rem,2.6vw,1.4rem);line-height:1.05;}
  .cap p{margin:0;color:var(--ink-soft);font-weight:600;font-size:clamp(.9rem,2.1vw,1rem);line-height:1.35;}
  .choose{margin:0 clamp(14px,2.2vw,20px) clamp(14px,2.2vw,18px);background:var(--accent);color:#fff;font-family:inherit;
    font-weight:800;font-size:1.02rem;border:none;border-radius:14px;padding:.6em;cursor:pointer;
    box-shadow:0 4px 0 rgba(3,21,31,.25);width:calc(100% - 2*clamp(14px,2.2vw,20px));transition:transform .1s;}
  .choose:active{transform:translateY(3px);}
  .card.chosen{transform:translateY(-6px) scale(1.02);}
  .card.chosen::after{content:"✓ Gewählt!";position:absolute;top:14px;right:14px;background:var(--sun);color:#06304d;
    font-weight:800;font-size:.9rem;padding:.3em .7em;border-radius:999px;box-shadow:0 4px 0 var(--sun-deep);}
  .card.dimmed{opacity:.5;filter:saturate(.65);}
  .banner{min-height:2.2em;margin-top:22px;}
  .banner .msg{display:inline-block;background:var(--sun);color:#06304d;font-weight:800;font-size:clamp(1.05rem,3vw,1.35rem);
    padding:.5em 1.1em;border-radius:18px;box-shadow:0 6px 0 var(--sun-deep);}
  .hint{margin-top:1.4em;font-weight:600;opacity:.85;font-size:.95rem;}
</style>
